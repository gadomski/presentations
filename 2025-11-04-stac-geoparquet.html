<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />

        <title>stac-geoparquet</title>

        <link rel="stylesheet" href="dist/reset.css" />
        <link rel="stylesheet" href="dist/reveal.css" />
        <link rel="stylesheet" href="dist/theme/devseed.css" />

        <!-- Theme used for syntax highlighted code -->
        <link rel="stylesheet" href="plugin/highlight/monokai.css" />
    </head>
    <body>
        <div class="reveal">
            <div class="slides">
                <section>
                    <h2>
                        Cloud-Native Geospatial Metadata with stac-geoparquet
                    </h2>

                    <img src="img/stac-geoparquet.png" height="200" />

                    <p style="font-size: xx-large">Pete Gadomski</p>
                </section>

                <section>
                    <section>
                        <h2>Cloud-native</h2>

                        <img
                            src="img/cloud-native.excalidraw.png"
                            class="r-stretch"
                        />

                        <p>Data should be useful at rest</p>
                    </section>

                    <section>
                        <h2>Cloud-native data</h2>

                        <img
                            src="img/cloud-native-data-formats.excalidraw.png"
                            class="r-stretch"
                        />
                    </section>

                    <section>
                        <h2>Cloud-native <u>META</u>data</h2>

                        <div style="font-size: xx-large">
                            <blockquote>
                                STAC is the map to your data.
                            </blockquote>
                            <p>&mdash; Howard Butler</p>
                        </div>
                        <img
                            src="img/what-the-stac.excalidraw.png"
                            class="r-stretch"
                        />
                    </section>
                </section>
            </div>
        </div>

        <script src="dist/reveal.js"></script>
        <script src="plugin/notes/notes.js"></script>
        <script src="plugin/markdown/markdown.js"></script>
        <script src="plugin/highlight/highlight.js"></script>
        <script>
            // More info about initialization & config:
            // - https://revealjs.com/initialization/
            // - https://revealjs.com/config/
            Reveal.initialize({
                hash: true,

                // Learn about plugins: https://revealjs.com/plugins/
                plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
            });
        </script>
    </body>
</html>
